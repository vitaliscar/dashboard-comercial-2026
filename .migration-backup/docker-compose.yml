services:
  postgres:
    image: postgres:18.6
    container_name: dashboard-comercial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_root_dev}
      POSTGRES_DB: ${POSTGRES_DB:-dashboard_comercial}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-app_admin_dev_pw}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-app_user_dev_pw}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dashboard_comercial}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
