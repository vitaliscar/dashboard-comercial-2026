name: Weekly Excel Load to Postgres
on:
  schedule:
    # Friday 5 AM America/Caracas time
    # UTC-4: 5 AM Caracas = 9 AM UTC
    - cron: "0 9 * * 5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-excel:
    runs-on: ubuntu-latest
    name: Load Excel data to Postgres
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Excel file
        env:
          EXCEL_URL: ${{ secrets.EXCEL_FILE_URL }}
        run: |
          if [ -z "$EXCEL_URL" ]; then
            echo "EXCEL_URL not configured. Using local file if available."
            ls -la | grep -i "CCV Rendimiento" || echo "No Excel file found"
          else
            curl -L "$EXCEL_URL" -o "CCV Rendimiento.xlsx"
          fi

      - name: Load Excel to Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: bun scripts/run-full-load.ts "CCV Rendimiento.xlsx"

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Fallo en carga semanal de Excel (${date})`,
              body: `❌ La carga semanal de Excel falló durante la ejecución del workflow.\n\n- **Fecha:** ${date}\n- **Workflow:** ${context.workflow}\n- **Run ID:** ${context.runId}\n- **Detalles:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
