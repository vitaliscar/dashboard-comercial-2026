services:
  postgres:
    image: postgres:18
    container_name: dashboard-comercial-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-dashboard_comercial}
    # Solo accesible desde localhost — Next.js corre en la misma máquina.
    # No exponer el puerto de Postgres a la red pública.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../docker/postgres-init:/docker-entrypoint-initdb.d:ro
      # Backups automáticos: montar un volumen adicional aquí si se agrega
      # un cron de pg_dump (no incluido por defecto).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-dashboard_comercial}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  postgres_data:
    driver: local
